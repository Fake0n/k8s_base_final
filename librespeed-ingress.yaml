apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: librespeed-ingress
  namespace: final
  labels:
    app.kubernetes.io/instance: librespeed
spec:
  rules:
  - host: localhost
    http:
      paths:
      - backend:
          service:
            name: librespeed-service
            port:
              number: 80
        path: /
status:
  loadBalancer: {}
