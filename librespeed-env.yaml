apiVersion: v1
kind: ConfigMap
metadata:
  name: librespeed-env
  namespace: final
  labels:
    app.kubernetes.io/instance: librespeed
data:
  MODE: frontend
  USE_NEW_DESIGN: "true"
  SERVER_LIST_URL: ""
  WEBPORT: "8008"
  REDACT_IP_ADDRESSES: "false"
  DB_TYPE: mysql
  ENABLE_ID_OBFUSCATION: "true"
  TELEMETRY: "true"
  DB_TYPE: "mysql"
  DB_USERNAME: "speedtest"
  DB_HOSTNAME: ""
  DB_NAME: "speedtest"
  DB_PORT: "3306"
